name: Verify and build iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main, codex/native-calibration]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: PieceFinder-browser
          path: build/web
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug
      - name: Boot an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          echo "IOS_SIMULATOR_ID=$device" >> "$GITHUB_ENV"
      - name: Test native app on iPhone simulator
        run: flutter test integration_test/app_test.dart -d "$IOS_SIMULATOR_ID" --reporter expanded
      - name: Build native iPhone release
        run: flutter build ios --release --no-codesign
      - name: Package IPA for personal signing
        run: |
          mkdir -p build/personal/Payload
          cp -R build/ios/iphoneos/Runner.app build/personal/Payload/
          cd build/personal
          zip -qry ../PieceFinder-unsigned.ipa Payload
      - name: Check installed app size budget
        run: python3 scripts/check_ipa_size.py build/PieceFinder-unsigned.ipa .artifacts/iphone-size.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-size-report
          path: .artifacts/iphone-size.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: PieceFinder-personal-signing
          path: build/PieceFinder-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-previews
          path: .artifacts/*.png
          include-hidden-files: true
